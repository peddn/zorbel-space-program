[package]
name = "zorbel-game"
description = "Darstellung und Steuerung mit Bevy. Die Simulation bleibt in sim-core und vessel."
version.workspace = true
edition.workspace = true

[dependencies]
sim-core.workspace = true
vessel.workspace = true
glam.workspace = true

# Schlanke Auswahl: 3D, UI, Fenster. Kein Audio, kein Gamepad (spart
# Systembibliotheken und Kompilierzeit).
[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "default_app",
    "3d_bevy_render",
    "ui_bevy_render",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "png",
]
