[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/vessel", "crates/flight-demo", "crates/zorbel-game"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
sim-core = { path = "crates/sim-core" }
vessel = { path = "crates/vessel" }

[profile.dev]
opt-level = 1

# Abhängigkeiten (Bevy) auch im Debug-Build optimieren: das Spiel bleibt
# flüssig, eigener Code kompiliert trotzdem schnell.
[profile.dev.package."*"]
opt-level = 2
